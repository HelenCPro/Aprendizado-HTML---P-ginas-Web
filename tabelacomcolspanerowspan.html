<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Tabela HTML</title>
</head>

<body>

<h2>Tabela com Colspan</h2>
<table width="50%" border="1">
	<tr>
		<th>Aluno</th>
		<th colspan="2">Disciplina</th>
	</tr>
	<tr>
		<td>Alex</td>
		<td>HTML</td>
		<td>Ambiente WEB</td>
	</tr>
</table>

<br>

<h2>Tabela com Rowspan</h2>
<table width="50%" border="1">
	<tr>
		<th>Aluno</th>
		<th>Disciplina</th>
	</tr>
	<tr>
		<td rowspan="2">Alex</td>
		<td>HTML</td>
	</tr>
	<tr>
		<td>Ambiente WEB</td>
	</tr>
</table>

</body>
</html>
